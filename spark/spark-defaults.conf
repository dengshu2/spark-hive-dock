# ============================================================
# Spark Defaults Configuration
# - YARN mode with Kerberos delegation token support
# - Hive Metastore integration via HDFS warehouse
# ============================================================

spark.master                            yarn
spark.submit.deployMode                 client
spark.sql.warehouse.dir                 hdfs://namenode.hive-net:9000/user/hive/warehouse
spark.hadoop.hive.metastore.uris        thrift://hive-metastore.hive-net:9083
spark.sql.catalogImplementation         hive
spark.serializer                        org.apache.spark.serializer.KryoSerializer

# Kerberos credentials
spark.kerberos.principal                spark/spark-connect.hive-net@EXAMPLE.COM
spark.kerberos.keytab                   /etc/security/keytabs/spark.keytab

# Spark Connect gRPC endpoint (binds 0.0.0.0:15002 inside the container;
# docker-compose maps it to 127.0.0.1:15002 on the host)
spark.connect.grpc.binding.port         15002

# YARN delegation token for HDFS — the key fix for Kerberos!
# This tells Spark to obtain HDFS delegation tokens and distribute
# them to Executor containers running on YARN NodeManagers.
spark.kerberos.access.hadoopFileSystems hdfs://namenode.hive-net:9000

# YARN staging dir: /user/<user> requires hdfs write permission on /user.
# Use /tmp (chmod 777) to avoid needing special HDFS user directories.
spark.yarn.stagingDir                   hdfs://namenode.hive-net:9000/tmp/spark-staging

# YARN resource allocation (Docker dev environment)
spark.executor.memory                   512m
spark.executor.cores                    1
spark.driver.memory                     1536m
spark.yarn.am.memory                    512m
spark.sql.adaptive.enabled              true
spark.sql.adaptive.coalescePartitions.enabled true

# --- ANSI SQL mode -----------------------------------------------------------
# Aligned with the Spark 4.x default (ANSI ON) after validating the workload:
# well-formed queries are unaffected; only genuinely-bad operations now fail
# loud instead of returning NULL — divide-by-zero (DIVIDE_BY_ZERO), invalid cast
# (CAST_INVALID_INPUT, e.g. CAST('abc' AS INT)), and integer overflow
# (ARITHMETIC_OVERFLOW). Clients that want lenient behaviour can use
# try_cast / try_divide, or SET spark.sql.ansi.enabled=false per session.
spark.sql.ansi.enabled                  true

# Hive Metastore client: Spark 4.1's builtin client is Hive 2.3.10, which calls
# the Thrift method get_table — removed in Hive 4.x (replaced by get_table_req).
# Talking to the Hive 4.1.0 HMS with the builtin client fails with
# "Invalid method name: 'get_table'". So we pin the client to 4.1.0 and load it
# from the Hive 4.1.0 jars baked into the image (spark/Dockerfile COPY --from the
# hive image) — no runtime Maven/Ivy download. Spark 4.x supports 4.x metastore
# versions via SPARK-45265.
spark.sql.hive.metastore.version        4.1.0
spark.sql.hive.metastore.jars           path
spark.sql.hive.metastore.jars.path      file:///opt/hive-metastore-libs/*.jar

# --- Apache Iceberg (table format, HiveCatalog over the Hive 4.1.0 HMS) -------
# The `iceberg` catalog uses Iceberg's HiveCatalog, which (unlike Spark's own
# spark_catalog) builds its HiveMetaStoreClient from the MAIN classpath and
# ignores spark.sql.hive.metastore.jars above. Spark bundles Hive 2.3.10 there,
# whose get_table Thrift call was removed in Hive 4.x. So we prepend the baked
# Hive 4.1.0 metastore client jars onto the driver classpath (extraClassPath is
# prepended) — Iceberg then resolves the 4.1.0 client (get_table_req). Verified
# this does NOT break spark_catalog (it uses the isolated 4.1.0 loader). The
# Iceberg runtime jar itself lives in $SPARK_HOME/jars (shipped to executors).
spark.driver.extraClassPath             /opt/hive-metastore-libs/hive-metastore-4.1.0.jar:/opt/hive-metastore-libs/hive-standalone-metastore-common-4.1.0.jar
spark.sql.extensions                    org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
spark.sql.catalog.iceberg               org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.iceberg.type          hive
spark.sql.catalog.iceberg.uri           thrift://hive-metastore.hive-net:9083
spark.sql.catalog.iceberg.warehouse     hdfs://namenode.hive-net:9000/user/hive/warehouse

# Make the DEFAULT catalog Iceberg-aware: SparkSessionCatalog delegates Iceberg
# tables to Iceberg and everything else to the built-in Hive catalog. Without
# this, an unprefixed reference to an Iceberg table (e.g. demo.events) goes
# through Spark's HiveExternalCatalog, which cannot parse the HMS-synced column
# type "TIMESTAMP WITH LOCAL TIME ZONE" (Iceberg timestamptz) and fails with
# CANNOT_RECOGNIZE_HIVE_TYPE. Uses the same HMS as spark_catalog by default.
spark.sql.catalog.spark_catalog         org.apache.iceberg.spark.SparkSessionCatalog
spark.sql.catalog.spark_catalog.type    hive

# Dynamic allocation — the Spark Connect Server is a long-running driver, so
# let it release idle executors and acquire more on demand instead of pinning
# the whole YARN cluster at all times. shuffleTracking is used because no
# external shuffle service (yarn aux-service) is configured on the NodeManager.
spark.dynamicAllocation.enabled                  true
spark.dynamicAllocation.shuffleTracking.enabled  true
spark.dynamicAllocation.shuffleTracking.timeout  120s
spark.dynamicAllocation.minExecutors             0
spark.dynamicAllocation.initialExecutors         0
spark.dynamicAllocation.maxExecutors             3
spark.dynamicAllocation.executorIdleTimeout      60s
