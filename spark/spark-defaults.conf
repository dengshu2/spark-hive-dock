# ============================================================
# Spark Defaults Configuration
# - YARN mode with Kerberos delegation token support
# - Hive Metastore integration via HDFS warehouse
# ============================================================

spark.master                            yarn
spark.submit.deployMode                 client
spark.sql.warehouse.dir                 hdfs://namenode.hive-net:9000/user/hive/warehouse
spark.hadoop.hive.metastore.uris        thrift://hive-metastore.hive-net:9083
spark.sql.catalogImplementation         hive
spark.serializer                        org.apache.spark.serializer.KryoSerializer

# Kerberos credentials
spark.kerberos.principal                spark/spark-connect.hive-net@EXAMPLE.COM
spark.kerberos.keytab                   /etc/security/keytabs/spark.keytab

# Spark Connect gRPC endpoint (binds 0.0.0.0:15002 inside the container;
# docker-compose maps it to 127.0.0.1:15002 on the host)
spark.connect.grpc.binding.port         15002

# YARN delegation token for HDFS — the key fix for Kerberos!
# This tells Spark to obtain HDFS delegation tokens and distribute
# them to Executor containers running on YARN NodeManagers.
spark.kerberos.access.hadoopFileSystems hdfs://namenode.hive-net:9000

# YARN staging dir: /user/<user> requires hdfs write permission on /user.
# Use /tmp (chmod 777) to avoid needing special HDFS user directories.
spark.yarn.stagingDir                   hdfs://namenode.hive-net:9000/tmp/spark-staging

# YARN resource allocation (Docker dev environment)
spark.executor.memory                   512m
spark.executor.cores                    1
spark.driver.memory                     1536m
spark.yarn.am.memory                    512m
spark.sql.adaptive.enabled              true
spark.sql.adaptive.coalescePartitions.enabled true

# Dynamic allocation — the Spark Connect Server is a long-running driver, so
# let it release idle executors and acquire more on demand instead of pinning
# the whole YARN cluster at all times. shuffleTracking is used because no
# external shuffle service (yarn aux-service) is configured on the NodeManager.
spark.dynamicAllocation.enabled                  true
spark.dynamicAllocation.shuffleTracking.enabled  true
spark.dynamicAllocation.shuffleTracking.timeout  120s
spark.dynamicAllocation.minExecutors             0
spark.dynamicAllocation.initialExecutors         0
spark.dynamicAllocation.maxExecutors             3
spark.dynamicAllocation.executorIdleTimeout      60s
